const L4=[
["Representation: kaun dikhta hai, kaise?","Giles Ch.10",`<ul><li><b>Under-representation</b> = symbolic annihilation (Gerbner 1978): group screen se gayab hi hai.</li><li><b>Misrepresentation</b> = stereotyping. Dono saath bhi ho sakte hain.</li><li><b>Stereotype</b> = simplifying category (info process karne ke liye). <b>Prejudice</b> = evaluative attitude. Media stereotypes matter karte hain kyunki audience unpe rely karti hai jab direct contact nahi hota (Craig 1992; Dyer 1993).</li></ul><div class="key">Key question: portrayal sirf society ko <i>reflect</i> karta hai ya audience ki soch ko <i>shape</i> karta hai? Giles: zyadatar studies effects ko <u>assume</u> karti hain, demonstrate nahi.</div>`],
["Women on screen","Giles Ch.10",`<ul><li>US prime-time characters <b>68.5% male</b>, 1973–93 (Gerbner 1997).</li><li>Main fiction characters <b>40% women</b> late 1990s, up from 28% in 1974 (Glascock 2001).</li><li>Roles: domestic &amp; relational; Goffman (1979) ad gestures &amp; body positioning.</li></ul><div class="key">Giles ka caution: zyada women ≠ kam stereotyping. <b>Quantity is not quality.</b> Production roles mein women zyada matter kar sakti hain.</div>`],
["Men & masculinities","Giles Ch.10",`<table><tr><th>Idea</th><th>Meaning</th></tr><tr><td>Mulvey 1975</td><td>Cinematic <b>male gaze</b>: camera heterosexual male viewpoint leta hai</td></tr><tr><td>Connell 1995</td><td>Hegemonic, conservative, subordinated masculinities</td></tr><tr><td>Kaufman 1999</td><td>Child-care ads: men infants ke saath, play mein, teenagers ke saath kam, mother ke bina kam</td></tr><tr><td>New lad</td><td>Ironic, retro masculinity, 1990s magazines/ads (Gill et al. 2000)</td></tr></table>`],
["Minorities, age & tokens","Giles Ch.10",`<ul><li>Over-60s: <b>21% population vs 7% on TV</b> (Age Concern 1999).</li><li>Southern California TV ads: <b>86% White, 1% Latino, 2% Asian American</b> (Coltrane &amp; Messineo 2000).</li><li><b>Tokens</b>: minority characters 'positive' token ya stereotype ke roop mein.</li><li>Giles critiques <b>Clark’s (1969) stage model</b>. Representation partly <b>commercial</b> hai: advertisers audience segment karte hain, spending power wale groups ko visibility milti hai.</li></ul>`],
["Disability","Giles Ch.10",`<ul><li>Obvious disability: <b>1.4% on British TV vs 14.2% real world</b> (Cumberbatch &amp; Negrine 1992).</li><li>Balter-style stereotypes: <b>Superhero, Sweet innocent, Sage</b> (compensating intuitive ability), <b>Obsessive avenger</b> (society ko blame).</li><li>Tokenism: ER ki Kerry Weaver disability se define nahi hoti, par role 'unidimensional'; Giles puchta hai disabled actor kyun nahi cast hua.</li><li>Audience study: <b>74%</b> non-disabled viewers portrayals se embarrassed nahi the.</li></ul>`],
["Mental health & cultural contexts","Giles Ch.10–11",`<ul><li>Mental illness: <b>violent ya comic</b> dikhaya jata hai. Signorielli (1989b): heavy viewers zyada fearful views.</li><li>Rose (1998), Wilson et al. (2000): news &amp; children’s TV mein stigma. Glasgow Media Group: public media se views banati hai.</li><li><b>Morley’s Nationwide (1980)</b>: audiences social position ke hisaab se alag decode karti hain.</li><li>Blain et al. (1993): national stereotypes; Mitra (1997): diasporic identity &amp; internet.</li></ul>`],
["Wheatley: Media & Cultural Identity","pjss-24-370",`<ul><li><b>Cultural imperialism</b> (Tomlinson): dominant cultures ka media weaker cultures ko homogenize karta hai. <b>Media imperialism</b> (Boyd-Barrett).</li><li><b>Representation theory</b> (Hall 1997): media reality construct karta hai, stereotypes affirm ya challenge.</li><li><b>Encoding/decoding</b> (Hall 1973): creator encode, audience decode (accept, negotiate, reject). <b>Hypodermic needle</b> = purani passive-audience theory.</li><li>West vs East: Western = individualism; Eastern (Japan, Korea) = community &amp; family; <b>Hallyu</b> Korean Wave.</li><li>Tech: streaming (Money Heist, Sacred Games) = homogenization <i>aur</i> diversification; social media (Instagram, TikTok) identity negotiation; <b>VR</b> 'Carne y Arena' (Iñárritu) = migrant empathy.</li><li>Impact: Crazy Rich Asians; post-9/11 Muslim portrayals; Mastro (bias), Essed (<b>everyday racism</b>), Dixon (crime news &amp; Black stereotypes), Wood (gender).</li><li><b>Case studies</b>: LGBTQ+ — <i>Moonlight</i> (2016, intersectionality), <i>Aligarh</i> (India), <i>We Don’t Live Here Anymore</i> (Nollywood). Africa — <i>Black Panther</i> (Wakanda, Afrofuturism, Western audience lens) vs Nollywood <i>Lionheart</i> (internal, everyday realities).</li><li>Solutions: diverse creators (Hunt &amp; Ramón), avoid tokenism, consult communities (Yuen), <b>media literacy</b> (Kellner &amp; Share).</li></ul>`],
["Moody-Ramirez: 100 years of JMCQ","JMCQ 2023",`<ul><li>Sample <b>330 texts</b>; method: content/textual analysis <b>75.45%</b>, interviews/focus groups 10.61%, survey &amp; experiment 3.33% each.</li><li>Themes: portrayals of women/LGBTQ+/ethnic minorities <b>56.06%</b>; media profession 16.36%; protests 11.82%; reception 7.88%; effects 7.88%.</li><li>Pehle minorities invisible; phir stereotypes (Black = crime, sports). <b>Entman’s conundrum</b>: ek misimpression theek karo to dusri badh sakti hai.</li><li>Intersectionality (Crenshaw); Lumsden: Black Panther Party paper ne counter-frames diye. Simone Biles forum.</li><li>Newsroom: glass ceiling; women-led papers (Everbach, Craft &amp; Wanta, Beam &amp; Di Cicco); Pritchard &amp; Stonbely: staff diversity ka coverage pe chhota asar; Sui et al.: <b>audience</b> key variable.</li><li>Social movements: Endres, Ashley &amp; Olson (feminists delegitimized), BLM special issue. Billings 2015: Jason Collins tweets vs newspapers.</li><li><b>De-westernizing</b> media studies. Terminology badla: Negro → African American → Black → BIPOC.</li></ul>`],
["Rupar: Diversity in the Age of Algorithms","MDRC study",`<ul><li>Diversity ab sirf demographics nahi, <b>communication policy principle</b> hai. Noble (2018) <i>Algorithms of Oppression</i>.</li><li>Dimensions: who speaks (source), content diversity, access, audience as co-creators, diversity experience, consumption, <b>recommender systems</b>.</li><li><b>Filter bubbles</b> (Pariser), <b>echo chambers</b> (Nguyen), information cocoons (Sunstein). <b>Diversity of exposure</b> (Napoli 2011): content diverse ho to bhi consumption diverse nahi hota.</li><li>Models: multiculturalism, cultural convergence, separation, assimilation, interculturalism, transnationalism, cosmopolitanism, equality-based, civic integration.</li><li>Case: <b>30 EC-funded projects (2021–22)</b>, avg €959,764; Greece &amp; Italy top; NGOs main beneficiaries. <b>Sectional</b> (within institutions) zyada, <b>intersectional</b> (critical) kam. AMIF = integration.</li><li>Future: holistic approach, algorithmic awareness, cross-sector collaboration, <b>media literacy</b>.</li></ul>`],
["Parasocial interaction","Giles Ch.11",`<div class="key">Horton &amp; Wohl (1956): media figure ke saath face-to-face relationship ka illusion — one-sided, par real feel hota hai.</div><table><tr><th>Order</th><th>Figure</th><th>Example</th></tr><tr><td>First</td><td>Person as themselves</td><td>Presenter, newsreader</td></tr><tr><td>Second</td><td>Fictional character played by person</td><td>Soap character</td></tr><tr><td>Third</td><td>Non-human/cartoon</td><td>Cartoon figure</td></tr></table><p>Extreme cases: parasocial grief (Diana, Jill Dando), Dietz et al. (1991) stalkers. Giles inhe <b>continuum ka end</b> maanta hai, pathology nahi.</p>`],
["Parasocial & influencers (Abdinagoro & Bismo 2025)","Multidisc. Sci. J.",`<ul><li>Indonesia, skincare, millennials; <b>253 respondents</b>, online survey, <b>SEM-PLS</b> (SmartPLS 3); 7 hypotheses.</li><li>Variables: social media interaction, parasocial relationship (PSR), <b>brand connection</b> (self-concept mein brand; Escalas), <b>relational quality</b> (trust, commitment, satisfaction), influencer (moderator).</li><li>H1 PSR→BC <b>0.334</b> (sig.); H2 SMI→BC <b>0.537</b> (sig.); H3 BC→RQ <b>0.249</b> (sig.).</li><li>Indirect: PSR→BC→RQ <b>0.083</b> (sig.); SMI→BC→RQ <b>0.134</b> (sig.).</li><li><b>H5 moderation rejected</b>: 0.032, t=1.076, p=0.283.</li><li>Limits: skincare only, subjective measures, cross-sectional.</li></ul>`],
["Fans, participation & social media","Giles Ch.11, 14",`<ul><li><b>Fans (Jenkins)</b>: fandom disorder nahi; fans texts reinterpret/reuse karte hain; apni culture banate hain; Hinerman: Elvis fans &amp; religion parallels.</li><li><b>Participation</b>: quiz → talk → reality TV; appeal = ordinary people visible; public sphere debate (Habermas; Livingstone &amp; Lunt); costs of fame, ethics.</li><li><b>Social media</b>: early internet (anonymity, identity, 'bare bones' text); Griffiths 1999 &amp; Young 1998 internet addiction; ab influencers, algorithms, short video, creator–fan parasocial ties.</li></ul>`],
["Film: 5-question framework","Giles Ch.2–3",`<ol><li>Kaun represented, kaun missing? (representation)</li><li>Camera ki gaze kiski? (Mulvey, Screen theory)</li><li>Hum kisse identify / parasocial bond karte hain? (identification vs PSI)</li><li>Alag audiences kaise decode karengi? (Hall, Morley)</li><li>Kaunsa effect claim karna padega, evidence kya? (effects caution)</li></ol>`],
["Sport (MediaSport)","Giles Ch.13",`<ul><li>Wenner 1998: viewers ke liye game personalities/feuds/heroes ka drama (Gazza’s tears, 1990).</li><li>Motives: Gantz 1981 (fanship, letting loose, learning). <b>Basking</b> (Cialdini 1976 'we won'). <b>Terror management</b> (Dechesne 2000: 1.61 vs 1.08 goals). <b>Mood</b> (Schwarz 1987; Schweitzer 1992: 69,300 vs 22,800 casualties).</li><li>Violence: Bryant 1998 (aggression↑ enjoyment↑, men); commentary shapes roughness (Comisky 1977).</li><li>Gender: 5% SI covers female 1954–78 (Gerbner 1978); Koivula 1999 &lt;2% airtime; FloJo vs Joyner-Kersee fashion over performance.</li><li>Race/nation: Blain 1993; 'natural athleticism' myth (Hoberman 1997).</li></ul>`],
["Climate change & science","Giles",`<ul><li>25% UK/Norway science stories scientists khud generate karte hain (Fenton 1998).</li><li><b>Hero</b>: 'breakthrough' motif (Nelkin 1987), method kam.</li><li><b>White coat</b>: stake inoculation (Edwards 1997) = expert story ko rubber-stamp karta hai.</li><li>Global warming stories mostly weather/political stories + climatologist quote.</li></ul>`],
["Telehealth","Giles",`<ul><li>US media psychologists (Joyce Brothers, Toni Grant): on-air advice, asli 'practise' questionable; ethics advice tak limit. APA Division 46.</li><li>Mediated communication disclosure &amp; intimacy badalta hai → online rapport.</li><li>Themes: access, online therapeutic alliance, privacy/data security, digital divide, regulation, apps &amp; AI.</li></ul>`],
["Media & Politics (Giles Ch.12)","Giles",`<ul><li><b>Transcendental realists</b>: hum events verify nahi kar sakte, media pe trust; Schlesinger 1978 'putting reality together'.</li><li><b>Ownership &amp; agenda-setting</b>: Murdoch’s Sun (Labour→Conservative→Labour); McCombs 1994; censorship overt form.</li><li><b>Framing KAL 007 (Soviets 1983) vs Iran Air 655 (US Navy 1988)</b>: 'Murder in the air' vs 'What went wrong'; victims named vs unnamed; deliberate vs mistake; nation blamed vs human error. Moral vs technical discourse.</li><li><b>Info processing</b>: newspapers &gt; TV knowledge (Robinson &amp; Davis 1990); poor memory (Gunter 1987); Kepplinger &amp; Daschmann: &gt;90% ne added info (source monitoring).</li><li><b>Newsreaders</b>: truth believed 63% (1983) → 79%; Mullen 1986 Peter Jennings facial expressions &amp; Reagan votes (single study).</li><li>Influence (framing, agenda, cues, cultivation) vs <b>audience agency</b> (Morley: engineers, union officials, students).</li><li>Giles’ limit: rhetoric ka impact assume hota hai, demonstrate nahi.</li></ul>`],
["Media & Politics in India (Dudankar 2024)","IJRAR",`<ul><li>Platforms: print (TOI, Hindu, Indian Express), TV (NDTV, CNN-News18, Republic), radio (AIR), digital. Roles: information, public opinion, engagement, <b>watchdog</b>.</li><li>Challenges: ownership, bias &amp; polarization, press freedom, fake news, economic pressure, regulation (MIB, Press Council).</li><li><b>Emergency 1975–77</b>: censorship, PIB/DAVP, journalists jailed → 1977 Janata Party win.</li><li><b>Demonetization 8 Nov 2016</b> (₹500/₹1000): supportive vs critical coverage → polarized opinion.</li><li>Methodology: secondary sources only.</li></ul>`]
];

const A4=[
["Explain under-representation and misrepresentation with examples. (Giles)","Under-representation (symbolic annihilation, Gerbner 1978) = groups absent: 7% over-60s on TV vs 21% population; 1.4% disabled vs 14.2%; 86% White in California ads. Misrepresentation = stereotypes: disability as superhero/sweet innocent/sage/avenger; women in domestic roles; mental illness as violent/comic. Both co-occur. Stereotypes matter because audiences use them without direct contact. Caution: effects are often assumed rather than demonstrated."],
["Discuss women and men in media with Giles' key studies.","Women: 68.5% male characters 1973–93; 40% women late 1990s vs 28% in 1974; Goffman's ad gestures; quantity ≠ quality, production roles matter. Men: Mulvey's male gaze; Connell's hegemonic/conservative/subordinated masculinities; Kaufman's child-care ads; 'new lad' irony (Gill et al.)."],
["Distinguish stereotypes, prejudice and tokenism; why do they matter?","Stereotype = simplifying cognitive category; prejudice = evaluative attitude; tokenism = one 'positive' minority figure standing in for diversity, often unidimensional (Kerry Weaver). They matter when direct contact is limited (Fujioka 1999: effects stronger when direct info limited)."],
["What are parasocial relationships? Explain Giles' orders and extreme cases.","Horton & Wohl 1956: one-sided illusion of intimacy. First order = real person as self (newsreader); second = fictional character (soap); third = cartoon. Extreme: grief at Diana/Jill Dando death, stalkers (Dietz 1991) — a continuum, not pathology per se."],
["Summarise Abdinagoro & Bismo (2025) findings and limitations.","253 millennials, SEM-PLS. PSR→brand connection 0.334, SMI→BC 0.537, BC→relational quality 0.249, indirect 0.083 and 0.134 all significant; influencer moderation rejected (p=0.283). Implication: choose influencers matching brand, informative content. Limits: skincare only, subjective, cross-sectional, no longitudinal."],
["Explain Wheatley's theoretical framework and case studies.","Cultural imperialism, representation theory, Hall's encoding/decoding, hypodermic needle, media imperialism. Cases: Moonlight vs Aligarh and We Don't Live Here Anymore (LGBTQ+ in West vs non-West); Black Panther vs Nollywood's Lionheart. Tech: streaming, social media, VR. Remedies: diverse production teams, anti-tokenism, community consultation, media literacy."],
["How has media representation research evolved in 100 years of JMCQ?","330 texts; 75% content analysis. Invisibility → stereotyping → improved but incomplete portrayals. Themes: portrayal 56%, profession 16%, protests 12%. Intersectionality, newsroom glass ceiling, audience as key driver of race coverage, terminology change, de-westernizing."],
["Why is media diversity harder in the algorithmic age? (Rupar)","Algorithms/recommenders create filter bubbles and echo chambers; availability ≠ exposure (Napoli). Diversity now includes sources, content, access, audience co-creation, experience. EC project study: mostly sectional, few intersectional. Need algorithmic awareness, cross-sector work, media literacy."],
["Why do people watch sport? Discuss MediaSport.","Wenner: personalities and drama. Motives (Gantz), basking (Cialdini), terror management (Dechesne), mood effects (Schwarz/Schweitzer). Plus violence, gender (5% SI covers, <2% airtime), race/nation stereotypes."],
["Discuss framing using KAL 007 vs Iran Air 655.","Four frame elements: agency, identification, categorisation, generalisation. KAL: 'murder', victims named, deliberate, nation blamed. Iran Air: 'what went wrong', victims unnamed, mistake, human error. Consistent across Time, Newsweek, NYT, WaPo, CBS: moral vs technical discourse."],
["Do media shape political ideology? Evidence both sides.","For: framing (Entman), agenda-setting (McCombs), ownership, newsreader cues (Mullen), cultivation. Against/agency: Morley's decoding; prior knowledge; poor news memory; Giles: effects assumed."],
["Media and politics in India: role and challenges.","Roles: information, opinion, engagement, watchdog. Challenges: ownership, bias/polarization, press freedom, fake news, economics, regulation. Cases: Emergency 1975–77 censorship → 1977 Janata win; demonetization 2016 polarized coverage."]

{n:"Unit 1 · Foundations & History",L:[
["What is media psychology? (Rutledge 2013)","Module 1",["Branch of psychology studying how <b>behaviour, cognition and emotion</b> interact with <b>media and technology</b>: use, design, sharing and psychological impact, across traditional/digital, personal/commercial, mobile/immersive.","Asks <i>psychological</i> questions (why do we feel, think, behave this way around media?) not just communication questions about messages/effects.","Rutledge: a <b>distinct field</b>, not a subset of communication or 'media effects'. Draws on cognitive, developmental, social, clinical and neuroscience theory; studies perception, meaning-making, identity, behaviour.","Inherently <b>interdisciplinary</b> (media studies, communication, sociology, anthropology, education) but committed to psychological theory and method.","<b>Applied</b>: consulting, design, production, education, therapeutic tech.","Misconception: a media psychologist ≠ a psychologist who appears on TV."]],
["Significance today","Module 1",["Media is <b>environmental</b>: near-constant exposure, inseparable from identity, relationships, emotion regulation, attention.","Applications: education (media literacy, e-learning), health (telehealth, body image), marketing/brand psychology, political communication, UX/persuasive design.","Grounds social debates: media violence, social media &amp; mental health, misinformation, problematic use (recur in Units 2–4)."]],
["Emergence of the field (Giles Ch.1)","History notes",["Field formed <b>late and outside psychology departments</b>: in North America research came from communication/media departments (J. of Broadcasting &amp; Electronic Media, J. of Communication).","<b>1991</b>: Reeves &amp; Anderson (Communication Research special issue): psychology and media studies can no longer ignore each other. Neisser (1976): psychology must interpret ordinary experience.","Europe: concentrated in Germany (journal <i>Medienpsychologie</i>; Winterhoff-Spurk 1995, 1997). Elsewhere media studies grew within cultural studies, where 'psychology' can be a negative word (Livingstone 1998). Livingstone 1999: audience research at a 'crossroads'.","<b>Why psychology neglected media</b>: scientific caution (lab measurement); academic snobbery (1993 UK minister: 'cultural Disneyland'); media mocks its own study; fast technological change vs 5-year research cycles (Livingstone &amp; Bovill 1999 dated on publication); problem-driven 1970s–80s effects research on violence.","Eron (1993): violence–aggression link as powerful as smoking–cancer; fed policy (V-chip). Eron entered accidentally via aggression research.","Cultural psychology also ignored media (preferred 'culturally durable' contexts)."]],
["APA Division 46 (1986)","History notes",["<b>1986</b> APA Division 46 Media Psychology: split focus — (a) training psychologists who appear in media, (b) promoting research on psychological aspects of media (Kirschner &amp; Kirschner 1997; Schwartz 1999).","Giles critical: no clear set of professional activities defines a 'media psychologist'; TV expert barely counts as applied psychology (e.g. Toni Grant, 'traditional feminine values').","APA and BPS guidelines discourage comment outside expertise (avoid quackery). Norway/Sweden: researchers contractually must present findings to media (Griffiths 2001)."]],
["Timeline of media research (Giles Ch.2)","History notes",["Two bodies of literature: <b>North American quantitative/experimental</b> and <b>European qualitative/cultural studies</b>, with small islands of convergence.","<b>1930s radio</b>: Cantril &amp; Allport 1935; Cantril, Gaudet &amp; Herzog 1940 <i>Invasion from Mars</i> (1938 War of the Worlds panic). <b>Hypodermic needle</b> (Lasswell 1935): propaganda injected into passive audience.","<b>Functionalism</b>: Hovland et al. 1949; Lazarsfeld &amp; Merton 1948 'narcotising dysfunction' (apathy: knowing replaces doing).","<b>Frankfurt School</b> (Adorno): culture industry, mass deception, threat to high culture, conformity.","British: Orwell's 1984; Leavis (1933) on cheap cinema; Raymond Williams 'flow' of TV.","<b>McLuhan</b>: 'the medium is the message', global village; critics: technological determinism (Enzensberger 1974).","<b>Postmodernism</b>: Baudrillard 'ecstasy of communication' (1985); Giddens prefers 'late modernity'; influential in Europe (feminism, queer theory); Billig 1999 critique: ignores political economy."]],
["Television as an emotional medium","Module 1",["Media engagement is <b>emotional</b>, not only informational: drives attention, memory, enjoyment, attitude change, continued use.","TV: first synchronous, narrative, audiovisual medium at scale in the home; intimacy and social presence (seed of parasocial interaction).","Shared emotional moments vs today's fragmented on-demand media.","Soil from which ADT, Simulation Theory and Theory of Play grew."]],
["Three theories: ADT, Simulation, Play","Module 1",["<b>Affective Disposition Theory</b> (Zillmann &amp; Cantor): enjoyment depends on liking/disliking of characters and their outcomes. Enjoyment ↑ when liked characters win or villains lose; ↓ otherwise. Subprocesses: (1) dispositions via moral judgement, (2) empathic reactivity, (3) hedonic evaluation of outcome. Moral monitoring; applies to drama, humour, sport, crime, suspense.","<b>Simulation Theory</b> (Oatley 1994): audiences run an internal mental simulation using imagery, memory, emotion; experience is internally constructed. Links to theory of mind and presence.","<b>Psychological Theory of Play</b> (Oerter 1999): media use = play: intrinsically motivated, involves change in perceived reality (alternate world, still 'not real'), bridge to presence; explains games, VR, scrolling where ADT fits less.","Vorderer's presence framework integrates all three."]],
["Methods in media psychology","Module 1",["<b>Quantitative</b>: experiments (causal, high internal validity, low generalisability); surveys; content analysis; longitudinal/panel designs.","<b>Qualitative</b>: ethnography, phenomenology, grounded theory, interviews/focus groups. Rutledge: ideal for complex socially embedded media; surfaces new phenomena.","<b>Applied</b>: UX, persuasive design, consulting, media literacy, health tech; mixed methods common.","<b>Challenges</b>: operationalising emotion/engagement (self-report vs physiology), ecological validity, rapid media change outpacing theory."]]

{n:"Unit 2 · Media Effects: Emotion, Attention, Cognition",L:[
["Two-factor theory & Excitation Transfer","Module 2",["<b>Schachter &amp; Singer 1962</b>: emotion = undifferentiated physiological arousal + cognitive label from situational/social cues.","<b>Excitation Transfer (Zillmann 1971)</b>: arousal from an exciting stimulus carries over and is misattributed to a later situation (argument on the bus after a film). Not imitation/social learning (Bandura).","Paradigm: view violent/neutral/erotic film → measure arousal → provoke → opportunity to aggress (simulated shocks).","<b>Critiques</b>: adrenalin fades in ~2 hours (A Clockwork Orange: violence in first 15 of 136 min yet copycat claims); in Zillmann's own 1971 study the <b>erotic film produced more arousal and aggression</b>; ethical limits → proxies (noise blasts, job ratings).","<b>Desensitisation</b>: repeated exposure blunts response. Puzzle: stronger effects in heavier-consuming males, awkward for pure desensitisation."]],
["Three-Factor Theory of Empathy (Zillmann 2006)","Module 2",["<b>Dispositional</b>: reflexive (innate, mirror neurons) + acquired (learned) tendencies → spontaneous empathy.","<b>Excitatory</b>: arousal intensity of empathic reaction.","<b>Experiential</b>: conscious contemplation of causes/consequences; can intensify or dampen (e.g. 'doesn't deserve sympathy').","<b>Empathy</b> = dispositions of amity (e.g. Taare Zameen Par). <b>Counterempathy</b> = dispositions of enmity (schadenfreude), often stronger.","Fiction is an empathy machine: clear moral cues, detailed consequences, excitation transfers across compacted segments."]],
["Motivation: SDT & Achievement Goals","Module 2",["<b>Self-Determination Theory</b> (Deci &amp; Ryan): <b>autonomy, competence, relatedness</b>. Ryan, Rigby &amp; Przybylski 2006: games satisfying autonomy+competence are more enjoyable, replayed, linked to wellbeing and presence. <b>PENS</b> model (Przybylski et al. 2010).","<b>Achievement goals</b>: Nicholls 1984 mastery vs ego; <b>Elliot &amp; McGregor 2×2 (2001)</b>: mastery-approach/avoidance, performance-approach/avoidance. Avoidance → worse outcomes (anxiety, lower esteem).","Gaming: explicit goals, feedback; men more 'achievers', women more 'non-achievers' preferring solo play. Mastery-approach predicts more meaning in life.","Sports media: performance-oriented viewers like outcomes; mastery-oriented like skill narratives."]],
["Attention: LC4MP & the brain","Module 2",["<b>LC4MP</b> (Lang 2000, 2006): limited-capacity processors; resources allocated across encoding, storage, retrieval. Two automatic mechanisms: <b>orienting responses</b> (cuts, sounds, camera moves) and <b>motivational relevance</b> (appetitive/aversive). Measured by secondary task reaction times; used for health messages.","<b>Posner &amp; Petersen</b> networks: <b>Alerting</b> (right frontal/parietal, locus coeruleus, norepinephrine; phasic/tonic); <b>Orienting</b> (parietal, frontal eye fields, pulvinar; acetylcholine; dorsal top-down vs ventral bottom-up, Corbetta &amp; Shulman 2002); <b>Executive control</b> (ACC, dlPFC; dopamine; impaired in ADHD).","William James 1890: attention implies withdrawal from some things to deal with others."]],
["Selective exposure & withdrawal","Module 2",["Klapper: replaced hypodermic needle with <b>limited effects</b>: media reinforces more than changes.","Selective <b>exposure</b>, <b>perception</b>, <b>retention</b>. Social media users concentrate on fewer sources → echo chambers.","'Withdrawal' = also disengagement from media (digital detox, irritability without phone); technology fatigue cycle; preview of addiction (Unit 3 in notes).","Activities: SDT audit of an app; 2×2 self-mapping; trailer cut-count; feed echo-chamber reflection."]],
["Cognitive effects, CMM and DSMM","Module 2",["Sanborn &amp; Harris: behavioural, attitudinal, <b>cognitive</b>, physiological effects. Agenda-setting is a cognitive effect.","<b>Cognitive Mediation Model</b> (Eveland 1998, 2001): surveillance motivation → attention + <b>elaboration</b> → learning. Exposure alone doesn't predict learning. Extended to Cognitive-Decision Mediation (behaviour, discussion).","<b>DSMM</b> (Valkenburg &amp; Peter 2013): effects small on average because of <b>susceptibility</b>: dispositional, developmental, social. Three response states (cognitive, emotional, excitative: 'mixing console'). <b>Four propositions</b>: conditional effects; susceptibility as indicators/predictors/moderators; media use can be outcome of susceptibility; relationships reciprocal over time."]],
["Brain & media dynamics","Module 2",["<b>Neurocinematics</b> (Hasson et al. 2008): fMRI + <b>inter-subject correlation</b>. <i>The Good, the Bad and the Ugly</i> synchronised ~45% of neocortex; unedited real footage far less. Fusiform gyrus on face close-ups; scene-transition regions. Basis of neuromarketing.","<b>Narrative transportation</b>: recruits scene-construction and theory-of-mind networks; link to Simulation Theory.","<b>Media multitasking</b>: heavy multitaskers worse at filtering and task-switching; causation unresolved (cause vs pre-existing weak control)."]]

["Attitude formation: factors","Module 3",["Attitude = <b>hypothetical construct</b>, inferred from behaviour; acquired, relatively permanent.","<b>Need satisfaction</b>: favourable to things that help reach goals; negative to obstacles.","<b>Social learning</b>: classical conditioning (child hears Pakistan is enemy → negative attitude; Dutch/Swedish words paired with positive/negative adjectives), instrumental conditioning (parents reward similar attitudes), observational learning (trust in parents/significant others).","<b>Group affiliations</b>: adopt norms to be accepted; conformity pressure.","<b>Cultural factors</b>: first-cousin marriage viewed differently in Muslim vs Hindu culture; Arapesh (cooperative) vs Mundugumor (aggressive).","<b>Personality</b>: consonant attitudes acquired easily; low IQ/literacy linked to conservative, suspicious, hostile.","<b>Stereotypes</b>: generalised expectations (women more religious/suggestible).","<b>Given information</b>: radio/TV shape opinions, though not all information has equal effect."]],
["Primary & reference groups","Module 3",["<b>Primary group</b>: family, peers; small, face-to-face; parents hugely influential.","Attitudinal homogeneity reasons: (1) conformity pressure, (2) similar attitudes → liking → more similarity, (3) same information processed similarly, (4) new members adopt group attitudes to gain acceptance.","<b>Reference group</b>: group you aspire to but don't belong to; standard for comparison."]],
["Attitude change: types & factors","Module 3",["<b>Congruent</b> change (favourable → more favourable) vs <b>incongruent</b> (reverses direction). Congruent is easier, especially when strength, stability and consonance of elements are high.","<b>Changing reference group</b>: Newcomb 1950, conservative girls became liberal by final year of college.","<b>Changing group affiliations</b>: depends on group characteristics (attractive norms) and membership characteristics (status, power, prestige); e.g. leader switching party.","<b>Additional information</b>: public commitment → rigidity; private stance changes more; <b>discussion beats lecture</b>: beef study 30% vs 3%."]],
["Persuasive communication: source","Module 3",["Four factors: <b>source, content, channel, audience</b>.","<b>Credibility</b> (trustworthy + expert): high-credibility source changes more; <b>sleeper effect</b>: over time source forgotten, message retained.","<b>Attractiveness</b>: physical beauty (ads) and <b>similarity</b> (Black students more moved by Black communicator)."]],
["Persuasive communication: content","Module 3",["<b>Fear appeal</b>: more effective when it offers ways to reduce fear (cigarette warnings).","<b>One-sided vs two-sided</b> (WWII soldiers vs Japan): neither better overall; one-sided for less educated, two-sided for graduates; those expecting short war moved by two-sided, long war by one-sided.","<b>Inoculation</b>: two-sided communication resists counter-propaganda: 67% retained position vs 2% (Russia atomic bomb study).","<b>Primacy vs recency</b>: first vs last information more effective. Also: draw conclusion or leave to audience."]],
["Channel, audience, enforced contact","Module 3",["<b>Channel</b>: personal contact more effective than mass media; active participation beats posters/pamphlets.","<b>Audience</b>: high self-esteem, self-confidence and aggressiveness → less affected; older age → rigidity, less change.","<b>Enforced contact</b>: opposing parties forced to interact (Indian and Pakistani sharing a room) gain first-hand information and test stereotypes."]]

{L:[
["Rutledge (2010): 'What is media psychology? Why care?'","Reference",["Field has <b>no consensus definition</b> and no clear career paths, yet adds value wherever human behaviour meets media technology.","Her 7-point logic: media technologies are everywhere → all ages use them a lot → young people most → older people worry → technology is not going away → everyone asks 'is it good or bad?' → <b>psychology studies people of all ages, so use psychology to answer the good/bad question</b>.","Both media and psychology shaped 20th-century western culture (Freudian references in fiction, operant conditioning in film)."]],
["Simulation Theory: an introduction","Reference",["Problem: we have no physical access to others' mental states, yet infer emotions, beliefs, desires, intentions.","Three accounts: <b>theory-theory</b> (we use a folk 'theory'), <b>simulation theory</b> (we mentally simulate: 'what would I do in his position?'), <b>interactionist</b> approach.","ST uses our own mental resources to model others; supported by cognitive neuroscience (mirror/mentalising systems). Links to Oatley's media simulation and to empathy."]],
["ADT in depth (updated chapter)","Reference",["Introduced 50+ years ago to explain <b>humour</b>; now a leading entertainment theory (Zillmann &amp; Bryant 1975; Zillmann &amp; Cantor 1976; Zillmann 2013 update).","Three subprocesses (modern wording): (1) <b>disposition formation</b> (liking/disliking), (2) <b>anticipatory responses</b> (hoping/fearing what happens), (3) <b>outcome evaluation</b> (pleasing/displeasing).","Current work: better measurement, new methods, clearer concepts, new theoretical pathways."]],
["Play theory: Sutton-Smith, Piaget, Vygotsky","Reference",["<b>Sutton-Smith</b> (play scholar, 50+ books): three theories — play as a <b>viability variable</b>, <b>culturally relative play forms</b>, a <b>co-evolutionary multiplex of functions</b>; play resists fixed meaning.","<b>Nicolopoulou (1993)</b>: Piaget (play within cognitive development, lacks sociocultural dimension) vs <b>Vygotsky</b> (social, interaction); both limited; proposes wider sociocultural view with Durkheim, Freud, Geertz.","<b>van Oers</b>: 'social representations' of play in Piaget (Rousseau/Schiller roots) and Vygotsky (cultural activity); matter for educational use of play."]]

["Q4. Discuss Rutledge's argument on what media psychology is and why it matters, with the simulation and play perspectives. (10)","Rutledge (2010, 2013) argues media psychology is a distinct, interdisciplinary and applied field despite lacking a single agreed definition.",[["Definition and logic",["Behaviour, cognition, emotion × media and technology; 7-step argument ending in 'use psychology to answer whether media is good or bad'.","Distinct from communication/effects research; applied in design, education, health, consulting; not 'psychologists on TV'."]],["Supporting theories",["ADT: disposition formation, anticipation, outcome evaluation.","Simulation: 'what would I do in his position', versus theory-theory and interactionist accounts.","Play: Sutton-Smith's three theories; Piaget vs Vygotsky (Nicolopoulou); social representations of play (van Oers)."]]],"The field matters because media is everywhere, and its psychological lenses (emotion, simulation, play) explain engagement better than message-effects alone."]
]},
{L:[
["Emotion & media (Nabi; Wirth & Schramm; 526621436)","Reference",["Cognition historically dominated media-effects research; emotion is now central.","Nabi: emotion as (a) <b>impetus for message selection</b>, (b) <b>outcome</b> of exposure, (c) <b>mechanism</b> of other effects such as persuasion.","Wirth &amp; Schramm (2005): emotion theories, genesis and types, methods; emotions as media effects: <b>empathy, mood regulation, arousal/excitation</b>.","Oxford chapter: evolution of emotions, affective dispositions, <b>mood management</b>, emotion regulation, online and video-game emotions, media-induced self-transcendent affect."]],
["Adolescents: perception, emotion, motivation","Reference",["Survey + qualitative content analysis of adolescents' media use.","Media has a <b>dual impact</b>: emotion regulation tool and trigger of antagonistic feelings; social comparison; altered ideas of beauty and success; blurred online/offline lines; aspiration, self-reflection, community, but also reliance and pressure to perform.","Supports the <b>Reinforcing Spirals Model</b>: media strengthens existing views and emotions in a feedback loop."]],
["Attention, multitasking & sleep","Reference",["Baumgartner (2022): effects of digital media and media multitasking on adolescent attention problems and sleep.","<b>Scoping review (94 papers, 110 studies, N=12,054)</b>: most experiments test immediate dual-task interference or device presence; few test sustained attentional change; effects often reflect <b>general multitasking costs</b>, not digital-specific mechanisms; conclusions depend on how media use and attention are operationalised."]],
["Selective exposure in the digital age","Reference",["Systematic review (PRISMA, <b>20 articles</b>): shift from online forums to <b>algorithm-driven social media</b>; extends beyond politics to health and environment.","Motivational drivers: <b>cognitive dissonance, group dynamics, technology</b>; individual agency + group affiliation + structures.","Selective exposure can be independent, dependent, mediating or moderating variable."]],
["Neurocinematics & empathy","Reference",["Hasson et al.: fMRI + ISC; some films control brain activity and eye movements, others not; depends on content, editing, directing style; bridge between neuroscience and film studies.","Trinity review: cinematic editing, neuroimaging of empathy, speculation that responses are driven by the <b>mirror neuron mechanism</b>."]]

["Q4. Discuss emotion, attention and selective exposure in the digital media environment. (10)","Recent reviews show emotion and attention are central to how digital media work and how effects arise.",[["Emotion",["Nabi: selection, outcome, mechanism; Wirth &amp; Schramm: empathy, mood regulation, excitation; adolescents: dual impact and Reinforcing Spirals Model."]],["Attention",["Baumgartner: multitasking and sleep; scoping review of 94 papers: mostly short-term dual-task costs, few long-term tests, operationalisation matters."]],["Selective exposure",["20-article review: algorithmic social media; dissonance, group dynamics, technology; wider than politics."]],["Brain",["ISC neurocinematics; mirror neuron account of film empathy."]]],"Digital media intensify emotion-driven choice and divided attention, but evidence on long-term harm is still mixed and depends on measurement."]

{L:[
["Media & human development: use across ages","Unit 10",["Development is <b>bidirectional</b>; media is a tool of socialisation but has both benefits and risks.","India: ~243 million social media users (Nasir 2018). Pew: teens used Facebook/YouTube most; Instagram 71%, Snapchat 65% among teens/young adults; 88% of 18–29-year-olds use social media (3+ hours daily).","Ages 3–4: ~14 hrs TV/week, now OTT and YouTube; 5–15: phones, tablets, laptops; 12–15: vloggers inspire creativity, but girls feel pressure to look glamorous (filters); online gaming boys 16 hrs vs girls 9 hrs."]],
["Cognitive development (Anderson &amp; Subrahmanyam 2017)","Unit 10",["Impact depends on <b>amount, content and social context</b> of viewing.","Under 2: negative; background TV distracts toddlers from play, reduces language and parent–child interaction; limit TV before age 2.","Educational video can improve vocabulary and academic knowledge; after age 6 entertainment media displaces reading, physical activity, concentration.","Violent games raise aggression; interactive games can improve concentration, visuo-spatial memory. Parents should model limited use."]],
["Risky behaviour","Unit 10",["Sensation-seeking youth use social media to express risk needs.","<b>Social construction model</b> (Subrahmanyam 2006): youth co-construct online communities aligned with developmental needs.","<b>Facebook influence model</b> (Moreno &amp; Whitehill 2014): social media intensifies peer influence; risky content gets rewarded and imitated."]],
["Mental health, body image, sleep","Unit 10",["Social media activates the brain's intrinsic reward system (Strickland 2014); motives: need to belong, self-presentation (Nadkarni &amp; Hofmann 2012).","Links to anxiety, depression, loneliness (Twenge 2019); passive browsing worst (Seabrook 2016); 2+ hours online linked to suicide risk factors (Twenge 2016); 'Facebook depression' (Fernández 2011). Social comparison hits self-esteem and diet behaviour.","<b>Sedentary behaviour</b>: obesity, diabetes, blood pressure; <b>social withdrawal hypothesis</b> (displacement of face-to-face contact → depression); disrupts circadian rhythm and sleep; media use up to 6h40m for kids (Barnett 2018)."]],
["Cyberbullying, suicide, violence","Unit 10",["<b>Proactive aggression</b> (to gain a goal) vs <b>reactive aggression</b> (retaliation); internal motives (payback, jealousy, approval) and external (vulnerable targets); linked to depression, anxiety, suicidal ideation; exposure to self-harm content can normalise it.","<b>Media violence</b>: <b>Bandura, Ross &amp; Ross (1961) Bobo doll</b>, observational learning; violent games reinforce violent strategies; violent lyrics raise aggressive thoughts."]],
["Positive influence of media","Unit 10",["<b>Belonging and support</b>: LGBT and minority users find solidarity, reduced isolation; fundraising, volunteering, creativity, self-development, wider discourse.","<b>Wellbeing</b>: likes/comments give emotional support, identity expression, purpose and contentment; mood uplift for those who find offline connection hard."]],
["Children, socialisation & media competence","Reference",["Panchal / IJCRT / organized review: ~80% of children watch TV/video daily; harms (stress, cyberbullying, anxiety, insomnia, sexting, depression, self-harm) and benefits (learning, friendship, support). Banning is not the answer; proactive parents, counsellors, pediatricians and industry.","Prot et al. (2014) <i>Media as Agents of Socialization</i> (Handbook of Socialization).","<b>Media competencies</b>: language, production, technology, interaction, values, aesthetics; needed for critical and responsible participation and equitable social development."]],
["Paluck (2009): Rwanda radio field experiment","Reference",["Year-long randomised field experiment, education-entertainment <b>radio soap opera</b> (LaBenevolencija) 10 years after the genocide vs control health soap.","Changed <b>perceived social norms and behaviours</b> (intermarriage, open dissent, trust, empathy, cooperation, trauma healing) but <b>not personal beliefs</b>; group discussion and emotion involved.","Conclusion: prioritise communicating <b>social norms</b> over changing beliefs."]],
["Persuasion vs propaganda; outrage on social media","Reference",["Saunders: persuasion vs propaganda, diffusion and adoption of innovations, ethics; case study of the <b>Swift Boat Veterans for Truth</b> (2004 US campaign) news framing; need for scrutiny of interest-group messages.","Sushant Singh Rajput case (India, COVID lockdown): Twitter/YouTube analysis; conspiracy and astroturfing; outrage rewarded with engagement; political hands; witch-hunt in a fractured media environment."]]

["Q4. Discuss the positive and negative influence of media on human development. (10)","Media is a tool of socialisation across the life span, and development is bidirectional (Unit 10).",[["Use across ages",["Toddlers to teens; OTT, YouTube, Instagram; Pew figures; India 243 million users."]],["Negative",["Cognitive: under-2 viewing, displacement of reading/activity; risky behaviour (social construction, Facebook influence models); mental health, body image, loneliness, social withdrawal; sedentary behaviour and sleep; cyberbullying (proactive/reactive) and suicide risk; media violence (Bandura 1961)."]],["Positive",["Belonging, support, wellbeing, creativity, fundraising, education, identity for minorities."]],["Role of parents and educators",["Limit early exposure, model use, media literacy and competencies, proactive not reactive strategies."]]],"Media's impact depends on content, amount, context and the child's susceptibility, so guided, literate use beats prohibition."],
["Q5. How can media change attitudes and reduce prejudice? (Paluck 2009 + persuasion) (10)","Persuasion research shows source, content, channel and audience matter; Paluck's field experiment shows media can change norms.",[["Persuasion factors",["Credible, similar sources; two-sided inoculation; personal channels; audience traits."]],["Paluck, Rwanda",["Randomised year-long radio soap; norms and behaviour shifted (intermarriage, dissent, trust, empathy, cooperation, trauma healing); beliefs unchanged; discussion and emotion mediated."]],["Propaganda and outrage",["Swift Boat case, Sushant Singh Rajput outrage: persuasion can slide into propaganda and astroturfing."]]],"Media influences behaviour mainly by shaping perceived social norms, so ethical, norm-based messaging is most effective."]

const U123X=1;const TM=[[
["Q1. Explain how and why media psychology emerged late and outside psychology departments. (10)","Media psychology, the study of how behaviour, cognition and emotion interact with media and technology, is a young field. Giles (2003) argues a field exists only when a critical mass of psychologists recognise common issues, and for media this took a long time.",[["Where it actually grew",["In North America, psychologically relevant media research came from communication/media departments (Journal of Broadcasting and Electronic Media, Journal of Communication), not psychology.","In Europe it concentrated in Germany (journal <i>Medienpsychologie</i>; Winterhoff-Spurk 1995, 1997); elsewhere media studies developed inside cultural studies, where psychologists are rare and 'psychology' can sound negative (Livingstone 1998)."]],["Why psychology neglected media",["<b>Scientific caution</b>: a young science avoided topics hard to measure in the lab.","<b>Academic snobbery</b>: 1993 UK minister called media studies 'cultural Disneyland for the weaker minded'; the press mocks PhDs on Madonna or Big Brother.","<b>Technological change</b>: media changes every decade while a rigorous study takes five-plus years; Livingstone &amp; Bovill (1999) was dated on publication.","<b>Problem-driven effects research</b>: 1970s–80s social psychology looked for harm, mainly violence; Eron (1993) compared the violence–aggression link to smoking–cancer, feeding policy such as the V-chip. Eron himself entered accidentally via aggression research.","Even cultural psychology ignored media, preferring 'culturally durable' contexts."]],["Institutional emergence",["<b>1991</b>: Reeves &amp; Anderson (Communication Research) argued psychology and media studies could no longer ignore each other; Neisser (1976): psychology must interpret ordinary experience.","<b>1986</b>: APA Division 46 formed, split between training psychologists who appear in media and promoting research. Giles criticises it: no clear professional activities define a media psychologist (e.g. Toni Grant).","APA/BPS guidelines discourage commenting outside expertise; Norway/Sweden require researchers to present findings to media."]]],"The field emerged late because of disciplinary caution, prestige issues, fast technology and a narrow harm-focused agenda, and it matured only when psychology and communication research converged after 1991. Rutledge (2013) now argues for it as a distinct, interdisciplinary, applied field."],
["Q2. Trace the history of media research from radio to postmodernism. (10)","Giles describes the history as two bodies of literature, a North American quantitative tradition and a European cultural-studies tradition, with small islands of convergence.",[["Pre-war: radio and the hypodermic needle",["Cantril &amp; Allport (1935) <i>The Psychology of Radio</i>; Cantril, Gaudet &amp; Herzog (1940) <i>Invasion from Mars</i> on the 1938 War of the Worlds panic.","<b>Hypodermic needle</b> (Lasswell 1935): propaganda injected into a passive audience, similar to 'brainwashing'."]],["War and post-war: two traditions",["<b>Communication science/functionalism</b>: Hovland, Lumsdaine &amp; Sheffield (1949), experiments; Lazarsfeld &amp; Merton (1948) 'narcotising dysfunction', apathy from knowing without acting.","<b>Frankfurt School</b>: Adorno and colleagues fled Nazi Germany; Marxist 'culture industry', 'mass deception', threat to high culture, conformity.","<b>British parallels</b>: Orwell's <i>1984</i> (TV as oppression), Leavis (1933) on cheap cinema, Raymond Williams on televisual 'flow'."]],["McLuhan and postmodernism",["<b>McLuhan</b>: 'the medium is the message', global village; critics call it technological determinism (Enzensberger 1974).","<b>Postmodernism</b>: Baudrillard (1985) 'ecstasy of communication', depoliticised masses; Giddens prefers 'late modernity'. More influential in Europe (feminism, queer theory, popular culture); Billig (1999) says it ignores political and economic realities."]],["Convergence",["Limited convergence; by the 1990s each side took the other more seriously. Key markers: 1986 APA Division 46, 1991 Reeves &amp; Anderson."]]],"Media research moved from fearing powerful media (hypodermic, Frankfurt) to recognising active audiences and cultural meaning (McLuhan, postmodernism), setting up today's effects and cultural traditions."],
["Q3. Explain Affective Disposition Theory, Simulation Theory and the Theory of Play. (10)","These three theories, linked through Vorderer's presence framework, explain how audiences psychologically engage with and enjoy media, a process rooted in television's emotional engagement.",[["Affective Disposition Theory (Zillmann &amp; Cantor)",["Enjoyment depends on dispositions (liking/disliking) toward characters and their outcomes.","Enjoyment rises when liked characters succeed or villains suffer; falls otherwise.","Three subprocesses: disposition formation by moral judgement, empathic reactivity, hedonic evaluation of outcome. Moral monitoring sorts heroes from villains.","Applies to drama, comedy, sport spectatorship, crime narratives, suspense."]],["Simulation Theory (Oatley 1994)",["Audiences run an internal mental simulation using imagery, memory and emotion, so experience is constructed internally.","Explains vivid emotion even without technology; ties to theory of mind and the feeling of presence in film, games and VR."]],["Psychological Theory of Play (Oerter 1999)",["Media use shares features of play: intrinsically motivated, attractive, and involving an alternate perceived reality while knowing it is not real.","Bridges to presence; covers games, VR and scrolling where character-based ADT fits less."]],["Comparison",["ADT = character-outcome logic; ST = cognitive construction; Play = motivational/alternate-reality frame."]]],"Together they show media enjoyment is emotional, constructive and playful, not passive reception."]
],[
["Q1. Explain Excitation Transfer Theory and Zillmann's three-factor theory of empathy. (10)","Both theories rest on Schachter and Singer's (1962) two-factor view: emotion = undifferentiated physiological arousal plus a cognitive label from situational cues.",[["Excitation Transfer (Zillmann 1971)",["Arousal from an exciting stimulus persists and is misattributed to a later situation (viewer fights on the bus, unaware arousal is film residue; Giles 2003).","It is not imitation (Bandura): exciting media amplifies a following provoked response.","Paradigm: view violent, neutral or erotic film, measure arousal, provoke, offer chance to aggress (simulated shocks)."]],["Critiques",["Adrenalin fades in about two hours; A Clockwork Orange's violence is in the first 15 of 136 minutes yet copycat effects were claimed.","Zillmann's own study: the erotic film caused more arousal and aggression than the violent one.","Ethics force proxies (noise blasts, job ratings). Desensitisation puzzle: stronger effects in heavier-consuming males."]],["Three-Factor Theory (2006)",["<b>Dispositional</b>: reflexive (mirror neurons) plus acquired tendencies.","<b>Excitatory</b>: arousal intensity.","<b>Experiential</b>: conscious reflection that can intensify or dampen.","<b>Empathy</b> (amity, e.g. Taare Zameen Par) vs <b>counterempathy</b> (enmity, schadenfreude, often stronger).","Fiction builds clear dispositions quickly and excitation transfers across compacted segments."]]],"ETT explains short-term carry-over of arousal but has limits; the three-factor theory links it to affective disposition and explains why fiction is such a strong empathy machine."],
["Q2. Discuss motivation and attention in media use. (10)","Media use is driven by needs and constrained by limited attention.",[["Motivation: Self-Determination Theory",["Autonomy, competence, relatedness. Ryan, Rigby &amp; Przybylski (2006): games meeting autonomy and competence are more enjoyable, replayed, linked to wellbeing and presence; PENS model (2010)."]],["Achievement goals",["Nicholls 1984 mastery vs ego; Elliot &amp; McGregor 2×2 (2001). Avoidance goals link to anxiety and lower esteem; mastery-approach predicts meaning in life. Gender differences in player types."]],["Attention: LC4MP (Lang)",["Limited capacity across encoding, storage, retrieval; orienting responses to cuts and sounds; motivational relevance sustains resources; measured with secondary task reaction times; used in health messaging."]],["Brain networks (Posner &amp; Petersen)",["Alerting: locus coeruleus, norepinephrine. Orienting: parietal, frontal eye fields, pulvinar, acetylcholine (dorsal vs ventral). Executive control: ACC and dlPFC, dopamine, impaired in ADHD."]],["Selective exposure and withdrawal",["Klapper's limited effects; selective exposure, perception, retention; echo chambers; withdrawal as digital detox or distress (James 1890)."]]],"Motivation determines what we choose, attention determines what we process, and both are shaped by finite cognitive resources and neural networks."],
["Q3. Explain the Cognitive Mediation Model, DSMM and the brain-based approach to media effects. (10)","Modern research replaced simple direct-effects thinking with models explaining who is affected and how.",[["Cognitive effects",["Sanborn &amp; Harris: behavioural, attitudinal, cognitive, physiological effects; agenda-setting is a cognitive effect."]],["Cognitive Mediation Model (Eveland 1998, 2001)",["Surveillance motivation → attention and <b>elaboration</b> → learning. Exposure alone does not predict learning; entertainment motivation yields less elaboration. Extended to the Cognitive-Decision Mediation Model for behaviour."]],["DSMM (Valkenburg &amp; Peter 2013)",["Effects are conditional on dispositional, developmental and social susceptibility; cognitive, emotional and excitative response states ('mixing console') incorporate ETT and desensitisation.","Four propositions: conditionality; susceptibility as indicator/predictor/moderator; media use as outcome of susceptibility; reciprocal relations over time.","Explains small average effects hiding a highly susceptible minority."]],["Brain and media",["Neurocinematics (Hasson et al. 2008): inter-subject correlation; the Good, the Bad and the Ugly synchronised about 45% of neocortex; fusiform gyrus on faces. Narrative transportation recruits scene-construction and theory-of-mind networks. Heavy media multitasking is linked to poorer filtering and task switching, with causation unresolved."]]],"CMM stresses processing, DSMM stresses individual differences, and neuroscience gives objective evidence of how media control attention."]
],[
["Q1. Discuss the factors responsible for attitude formation. (10)","An attitude is a hypothetical construct inferred from behaviour; it is acquired through many influences.",[["Need satisfaction",["We favour things that help reach goals and dislike obstacles; students developed favourable attitudes to goal-instrumental things."]],["Social learning",["<b>Classical conditioning</b>: repeated pairing (child hears Pakistan is an enemy; Dutch/Swedish paired with positive/negative adjectives).","<b>Instrumental conditioning</b>: attitudes matching parents are rewarded.","<b>Observational learning</b>: copying trusted parents and significant others."]],["Group affiliations",["Primary groups (family, peers) show homogeneity due to conformity pressure, liking-similarity, shared information and new-member adaptation. Reference groups provide aspirational standards."]],["Culture, personality, stereotypes, information",["Culture: first-cousin marriage in Muslim vs Hindu culture; Arapesh vs Mundugumor.","Personality: consonant attitudes acquired easily; low IQ/literacy linked to conservatism and hostility.","Stereotypes: generalised expectations (women as more religious).","Given information: radio and TV shape opinions, though not equally."]]],"Attitudes arise from the interaction of needs, learning, groups, culture, personality, stereotypes and information."],
["Q2. Write an essay on the process of attitude change. (10)","Attitudes are relatively permanent but change slowly over time.",[["Types",["<b>Congruent</b> change intensifies the existing direction; <b>incongruent</b> reverses it. Congruent is easier, especially when strength, stability and consonance are high."]],["Factors",["<b>Reference group</b>: Newcomb (1950), conservative girls became liberal by final year.","<b>Group affiliation</b>: depends on group characteristics (attractive norms) and membership characteristics (status, power, prestige), e.g. party switch.","<b>Additional information</b>: public commitment increases rigidity; private stance changes more; discussion beats lecture (30% vs 3% in the beef study).","<b>Persuasive communication</b> (source, content, channel, audience).","<b>Enforced contact</b>: forced interaction between opposing parties gives first-hand information."]]],"Attitude change depends on existing attitude strength, social context and the quality of information and contact."],
["Q3. Explain persuasive communication and its determinants. (10)","Persuasive communication presents appealing facts bearing on attitudes; its success depends on four factors.",[["Source",["<b>Credibility</b> (trust and expertise) gives more change; <b>sleeper effect</b>: source forgotten, message retained.","<b>Attractiveness</b>: beauty (ads) and similarity (Black communicator for Black students)."]],["Content",["<b>Fear appeals</b> work when remedies are offered (cigarette warnings).","<b>One- vs two-sided</b>: WWII soldiers study; one-sided for less educated, two-sided for graduates; depends on initial stance.","<b>Inoculation</b>: 67% vs 2% retained position after counter-propaganda.","<b>Primacy vs recency</b>: first vs last information; also conclusion drawn or left open."]],["Channel",["Personal contact beats mass media; active participation beats posters."]],["Audience",["High self-esteem and confidence resist change; older people more rigid."]]],"Effective persuasion needs a credible, attractive source, well-organised content, personal channels and a receptive audience."]

["Q1. Discuss media representation of gender, minorities, disability and mental health. (10)","Giles (Ch.10) shows representation has two distortions: under-representation (symbolic annihilation, Gerbner 1978) and misrepresentation (stereotyping); a stereotype is a simplifying category, prejudice an evaluative attitude.",[["Gender",["68.5% of US prime-time characters male (1973–93); women 40% of main fiction characters late 1990s vs 28% in 1974; Goffman's ad gestures. More women ≠ less stereotyping.","Men: Mulvey's male gaze; Connell's masculinities; Kaufman's child-care ads; the new lad."]],["Minorities and age",["Over-60s 21% of UK vs 7% on TV; Southern California ads 86% White, 1% Latino, 2% Asian American; tokenism; representation is commercial (spending power)."]],["Disability",["1.4% on TV vs 14.2% real; Balter stereotypes; Kerry Weaver tokenism."]],["Mental health, culture",["Violent or comic portrayals; Signorielli 1989b; Morley's Nationwide decoding."]],["Research caution",["Moody-Ramirez et al. (2023): 330 JMCQ texts, 75.45% content analysis; Entman's conundrum. Giles: effects are often assumed, not demonstrated."]]],"Representation is unequal and often stereotyped, but effects depend on audience decoding."],
["Q2. Explain parasocial relationships and influencer marketing. (10)","Horton &amp; Wohl (1956) defined parasocial interaction as an illusion of face-to-face relationship with a media figure: one-sided but felt as real.",[["Giles' orders",["First: real person as self (newsreader). Second: fictional character (soap). Third: cartoon. Extreme cases: grief for Diana, Jill Dando; stalkers (Dietz 1991), seen as a continuum."]],["Social media",["Influencers create creator–fan parasocial ties via comments and DMs, authenticity and similarity (Tukachinsky &amp; Stever 2019)."]],["Abdinagoro &amp; Bismo (2025)",["253 Indonesian millennials, skincare, SEM-PLS.","PSR→brand connection 0.334; interaction→BC 0.537; BC→relational quality 0.249; indirect 0.083 and 0.134; influencer moderation rejected (p=0.283).","Brand connection = brand in self-concept (Escalas). Limits: single sector, subjective, cross-sectional."]],["Fans and participation",["Jenkins: fandom is not disorder; reality TV and public sphere debates."]]],"Parasocial bonds are normal and commercially powerful, shaping brand connection and trust."],
